[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskboard"
version = "0.1.0"
description = "An application built with yuanboot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["yuanboot @ git+https://github.com/liangboceo/yuanboot-python.git@v0.1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
cloud = ["yuanboot[all] @ git+https://github.com/liangboceo/yuanboot-python.git@v0.1.2"]

[tool.hatch.build.targets.wheel]
packages = ["taskboard"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.yuanboot]
kind = "web"
app = "taskboard.main:app"
module = "taskboard.main"

[tool.pytest.ini_options]
testpaths = ["tests"]
