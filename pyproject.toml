[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yuanboot"
dynamic = ["version"]
description = "A dependency-injected Python microservice framework built on FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "jackson liang"}]
keywords = ["fastapi", "microservice", "dependency-injection", "nacos", "yuanboot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
binary = ["pyinstaller>=6.16,<7"]
dev = ["ruff>=0.9", "build>=1.2", "twine>=6,<7"]
jwt = ["PyJWT>=2.9,<3"]
mysql = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2"]
redis = ["redis>=5,<8"]
nacos = ["httpx>=0.27,<1"]
http = ["httpx>=0.27,<1"]
apollo = ["httpx>=0.27,<1"]
discovery = ["httpx>=0.27,<1"]
xxljob = ["httpx>=0.27,<1"]
scheduler = ["croniter>=3,<7"]
grpc = ["grpcio>=1.66,<2", "grpcio-health-checking>=1.66,<2"]
all = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2", "redis>=5,<8", "httpx>=0.27,<1", "PyJWT>=2.9,<3", "croniter>=3,<7", "grpcio>=1.66,<2", "grpcio-health-checking>=1.66,<2"]

[project.scripts]
yuanbootctl-python = "yuanboot.cli:main"

[project.urls]
Homepage = "https://github.com/liangboceo/yuanboot-python"
Documentation = "https://github.com/liangboceo/yuanboot-python/tree/master/docs"
Repository = "https://github.com/liangboceo/yuanboot-python"
Issues = "https://github.com/liangboceo/yuanboot-python/issues"
Releases = "https://github.com/liangboceo/yuanboot-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/yuanboot"]
core-metadata-version = "2.4"

[tool.hatch.version]
path = "src/yuanboot/_version.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/docs", "/packaging", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/data", "**/*.log"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
