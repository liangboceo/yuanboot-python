[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yuanboot"
dynamic = ["version"]
description = "A dependency-injected Python microservice framework built on FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "yuanboot contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9", "build>=1.2", "PyJWT>=2.9,<3"]
jwt = ["PyJWT>=2.9,<3"]
mysql = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2"]
redis = ["redis>=5,<8"]
nacos = ["httpx>=0.27,<1"]
http = ["httpx>=0.27,<1"]
apollo = ["httpx>=0.27,<1"]
discovery = ["httpx>=0.27,<1"]
xxljob = ["httpx>=0.27,<1"]
scheduler = ["croniter>=3,<7"]
grpc = ["grpcio>=1.66,<2", "grpcio-health-checking>=1.66,<2"]
all = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2", "redis>=5,<8", "httpx>=0.27,<1", "PyJWT>=2.9,<3", "croniter>=3,<7", "grpcio>=1.66,<2", "grpcio-health-checking>=1.66,<2"]

[project.scripts]
yuanbootctl = "yuanboot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yuanboot"]

[tool.hatch.version]
path = "src/yuanboot/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts/prepare_release.py", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/data", "**/*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
