[build-system]
requires = [
  "hatchling>=1.27,<2; python_version >= '3.8'",
  "setuptools>=59.6,<60; python_version < '3.8'",
  "wheel<0.38; python_version < '3.8'",
  "toml>=0.10.2,<1; python_version < '3.8'",
]
build-backend = "yuanboot_build"
backend-path = ["_build_backend"]

[project]
name = "yuanboot"
dynamic = ["version"]
description = "A dependency-injected Python microservice framework built on FastAPI"
readme = "README.md"
requires-python = ">=3.6.2"
license = "MIT"
authors = [{name = "jackson liang"}]
keywords = ["fastapi", "microservice", "dependency-injection", "nacos", "yuanboot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "packaging>=20.4",
  "importlib-metadata>=4.8,<7; python_version < '3.8'",
  "dataclasses>=0.8,<0.9; python_version < '3.7'",
  "contextvars>=2.4,<3; python_version < '3.7'",
  "aiocontextvars>=0.2.2,<0.3; python_version < '3.7'",
  "async-generator>=1.10,<2; python_version < '3.7'",
  "typing-extensions>=3.10.0.2",
  "importlib-resources>=5.4; python_version < '3.9'",
  "toml>=0.10.2,<1; python_version < '3.11'",
  "fastapi>=0.83,<0.84; python_version < '3.8'", "fastapi>=0.115,<1; python_version >= '3.8'",
  "pydantic>=1.9,<1.10; python_version < '3.8'", "pydantic>=2.9,<3; python_version >= '3.8'",
  "uvicorn[standard]>=0.16,<0.17; python_version < '3.8'", "uvicorn[standard]>=0.30,<1; python_version >= '3.8'",
  "PyYAML==6.0; python_version < '3.8'",
  "PyYAML>=6,<7; python_version >= '3.8'",
  "jinja2>=3.0,<3.1; python_version < '3.8'", "jinja2>=3.1,<4; python_version >= '3.8'",
  "prometheus-client>=0.12,<0.15; python_version < '3.8'", "prometheus-client>=0.21,<1; python_version >= '3.8'",
]

[project.optional-dependencies]
build = ["build>=0.7,<0.8; python_version < '3.8'", "build>=1.2; python_version >= '3.8'"]
binary = ["pyinstaller>=4.10,<5; python_version < '3.8'", "pyinstaller>=6.16,<7; python_version >= '3.8'"]
admin = ["cryptography>=3.4.8,<39; sys_platform == 'win32' and python_version < '3.8'", "SQLAlchemy>=1.4.24,<1.5; python_version < '3.8'", "SQLAlchemy>=2.0,<3; python_version >= '3.8'", "PyMySQL[rsa]>=1.0.2,<1.1; python_version < '3.8'", "PyMySQL[rsa]>=1.1,<2; python_version >= '3.8'", "redis>=4.3,<4.4; python_version < '3.8'", "redis>=5,<8; python_version >= '3.8'", "PyJWT>=2.4,<2.5; python_version < '3.8'", "PyJWT>=2.9,<3; python_version >= '3.8'", "httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'", "Pillow>=8.4,<9; python_version < '3.8'", "Pillow>=10.4,<13; python_version >= '3.8'", "python-multipart>=0.0.5,<0.0.6; python_version < '3.8'", "python-multipart>=0.0.18,<1; python_version >= '3.8'"]
dev = ["yuanboot[build]", "ruff>=0.9; python_version >= '3.8'", "twine>=3.4,<4; python_version < '3.8'", "twine>=6,<7; python_version >= '3.8'"]
jwt = ["cryptography>=3.4.8,<39; sys_platform == 'win32' and python_version < '3.8'", "PyJWT>=2.4,<2.5; python_version < '3.8'", "PyJWT>=2.9,<3; python_version >= '3.8'"]
mysql = ["cryptography>=3.4.8,<39; sys_platform == 'win32' and python_version < '3.8'", "SQLAlchemy>=1.4.24,<1.5; python_version < '3.8'", "SQLAlchemy>=2.0,<3; python_version >= '3.8'", "PyMySQL[rsa]>=1.0.2,<1.1; python_version < '3.8'", "PyMySQL[rsa]>=1.1,<2; python_version >= '3.8'"]
redis = ["redis>=4.3,<4.4; python_version < '3.8'", "redis>=5,<8; python_version >= '3.8'"]
nacos = ["httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'"]
http = ["httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'"]
apollo = ["httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'"]
discovery = ["httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'"]
xxljob = ["httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'"]
scheduler = ["python-dateutil>=2.8,<3", "croniter>=1.3.8,<2; python_version < '3.8'", "croniter>=3,<7; python_version >= '3.8'"]
grpc = ["grpcio>=1.48.2,<1.49; python_version < '3.8'", "grpcio>=1.66,<2; python_version >= '3.8'", "grpcio-health-checking>=1.48.2,<1.49; python_version < '3.8'", "grpcio-health-checking>=1.66,<2; python_version >= '3.8'"]
all = ["cryptography>=3.4.8,<39; sys_platform == 'win32' and python_version < '3.8'", "python-dateutil>=2.8,<3", "Pillow>=8.4,<9; python_version < '3.8'", "Pillow>=10.4,<13; python_version >= '3.8'", "python-multipart>=0.0.5,<0.0.6; python_version < '3.8'", "python-multipart>=0.0.18,<1; python_version >= '3.8'", "SQLAlchemy>=1.4.24,<1.5; python_version < '3.8'", "SQLAlchemy>=2.0,<3; python_version >= '3.8'", "PyMySQL[rsa]>=1.0.2,<1.1; python_version < '3.8'", "PyMySQL[rsa]>=1.1,<2; python_version >= '3.8'", "redis>=4.3,<4.4; python_version < '3.8'", "redis>=5,<8; python_version >= '3.8'", "httpx>=0.22,<0.23; python_version < '3.8'", "httpx>=0.27,<1; python_version >= '3.8'", "PyJWT>=2.4,<2.5; python_version < '3.8'", "PyJWT>=2.9,<3; python_version >= '3.8'", "croniter>=1.3.8,<2; python_version < '3.8'", "croniter>=3,<7; python_version >= '3.8'", "grpcio>=1.48.2,<1.49; python_version < '3.8'", "grpcio>=1.66,<2; python_version >= '3.8'", "grpcio-health-checking>=1.48.2,<1.49; python_version < '3.8'", "grpcio-health-checking>=1.66,<2; python_version >= '3.8'"]

[project.scripts]
yuanbootctl-python = "yuanboot.cli:main"

[project.urls]
Homepage = "https://github.com/liangboceo/yuanboot-python"
Documentation = "https://github.com/liangboceo/yuanboot-python/tree/master/docs"
Repository = "https://github.com/liangboceo/yuanboot-python"
Issues = "https://github.com/liangboceo/yuanboot-python/issues"
Releases = "https://github.com/liangboceo/yuanboot-python/releases"

[tool.hatch.build]
artifacts = ["src/yuanboot/cli/templates/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/yuanboot"]
core-metadata-version = "2.4"

[tool.hatch.version]
path = "src/yuanboot/_version.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/docs", "/packaging", "/README.md", "/LICENSE", "/pyproject.toml", "/_build_backend", "/setup.py", "/MANIFEST.in"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/data", "**/*.log"]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "UP006", "UP007", "UP036", "UP045"]
