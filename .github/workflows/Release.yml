name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v, for example 0.1.3
        type: string
        required: true
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        required: true
        default: true
      draft:
        description: Create a draft GitHub Release
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Require master
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/master
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - name: Prepare version and reject an existing tag
        shell: bash
        run: |
          tag=$(python packaging/prepare_release.py "$RELEASE_VERSION")
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Tag $tag already exists; choose a new version." >&2
            exit 1
          else
            status=$?
            test "$status" = 2
          fi
      - run: python -m pip install -e '.[dev,all]'
      - run: ruff check . && ruff format --check .
      - run: python packaging/build_packages.py
      - run: python -m twine check dist/*
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  binaries:
    needs: build
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Create tag and release
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-binaries-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(Path('dist').iterdir())
          Path('dist/SHA256SUMS').write_text(''.join(
              f'{hashlib.file_digest(path.open("rb"), "sha256").hexdigest()}  {path.name}\n'
              for path in files if path.is_file()
          ))
          PY
      - name: Commit version and publish immutable tag on master
        shell: bash
        run: |
          git fetch origin master --tags
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || {
            echo 'master changed during the build; rerun from the latest master.' >&2
            exit 1
          }
          tag=$(python packaging/prepare_release.py "$RELEASE_VERSION")
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; choose a new version." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/yuanboot/_version.py
          if ! git diff --cached --quiet; then
            git commit -m "Release yuanboot Python $RELEASE_VERSION"
          fi
          git tag -a "$tag" -m "yuanboot Python $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$tag"
      - name: Create GitHub Release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          gh release create "$tag" dist/* --verify-tag \
            --title "$tag" --generate-notes \
            --draft="$RELEASE_DRAFT" --prerelease="$RELEASE_PRERELEASE"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
